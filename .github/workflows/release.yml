name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.1.62-0.1.103)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify version tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-w?[0-9]+\.[0-9]+\.[0-9]+)?$ ]]
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm run lint
          npm run typecheck
          npm run test:deploy

      - name: Test, build and package
        run: node scripts/release.mjs --kind=all --release-url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"

      - name: Verify release assets
        working-directory: release
        run: |
          sha256sum -c SHA256SUMS
          sh -n hub-install.sh
          sh -n runner-install.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release

      - name: Publish GitHub Release
        shell: bash
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" == false ]]; then
              echo "Release $RELEASE_TAG has already been published."
              exit 0
            fi
          else
            base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest/download"
            cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## Install or upgrade

          Linux / macOS:

          \`\`\`sh
          curl -LsSf $base/hub-install.sh | sh
          curl -LsSf $base/runner-install.sh | sh
          \`\`\`

          Windows PowerShell:

          \`\`\`powershell
          & ([scriptblock]::Create((curl.exe -LsSf '$base/hub-install.ps1' | Out-String)))
          & ([scriptblock]::Create((curl.exe -LsSf '$base/runner-install.ps1' | Out-String)))
          \`\`\`

          Run the Hub command first. Create a runner in Settings and enter its Hub address and connection token on the runner machine. Run the same installer again to upgrade.
          EOF
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
