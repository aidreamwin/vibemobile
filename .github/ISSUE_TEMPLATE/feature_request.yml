name: Feature request
description: 提出一个功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述使用场景和当前的不便，而不是先给出实现方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 如果有多个方案，请说明取舍
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - Codex provider
        - Claude provider
        - 前端 / 移动端交互
        - 文件 / 终端
        - 部署 / 多 runner
        - 文档 / 工程化
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue 和 docs/limitations.md
          required: true
