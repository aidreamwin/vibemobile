name: vibemobile
services:
  vibemobile:
    image: ${VIBEMOBILE_IMAGE:-vibemobile:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibemobile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - VIBEMOBILE_HOST=0.0.0.0
      - VIBEMOBILE_PIN=${VIBEMOBILE_PIN:-}
      - VIBEMOBILE_NO_AUTH=${VIBEMOBILE_NO_AUTH:-}
      - VIBEMOBILE_ROOTS=${VIBEMOBILE_ROOTS:-/app/workspace}
      - VIBEMOBILE_LOG=${VIBEMOBILE_LOG:-info}
      - VIBEMOBILE_TERMINAL=${VIBEMOBILE_TERMINAL:-on}
      - VIBEMOBILE_SHELL=/bin/bash
      - CODEX_WS_URL=${CODEX_WS_URL:-}
    volumes:
      # 持久化 vibemobile 的登录 PIN 和 JWT 密钥
      - vibemobile-data:/app/data
      # 挂载宿主机工作区（供两个代理操作）
      - ${HOST_WORKSPACE_DIR:-.}:/app/workspace
      # 可选：两个代理的登录态都不在镜像里，要在容器内用哪个就挂哪个
      # - ~/.codex:/root/.codex
      # - ~/.claude:/root/.claude
volumes:
  vibemobile-data:
