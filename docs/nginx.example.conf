# VibeMobile Hub —— nginx 站点配置（只有 server 块）
#
# 直接粘贴到站点的 server {} 配置里（宝塔/aaPanel 的「配置文件」、或
# sites-enabled 里的站点文件），只需要改两处：
#
#   server_name  -> 你的域名
#   proxy_pass   -> Hub 的地址（默认 127.0.0.1:3010）
#
# 证书路径按实际位置调整。HTTP->HTTPS 跳转、以及可选的 limit_req 限流
# 属于 http/server 之外或面板管理的部分，不在本文件里；应用自身的登录限流
# 在 X-Forwarded-For 被正确覆盖后即可正常工作。
#
# 三条不能改的约束：
#   1. X-Forwarded-For 必须覆盖成 $remote_addr（不要用
#      $proxy_add_x_forwarded_for）。Hub 开启了 TRUST_PROXY，Fastify 取
#      最左值；追加写法会保留客户端伪造的地址，登录限流就失效了。
#   2. Host 必须用 $http_host（保留非默认端口），否则 Hub 推导出的同源
#      地址会和浏览器不一致。
#   3. WebSocket 必须转发 Upgrade/Connection，否则聊天、终端和 runner
#      注册（/runner/connect）都连不上。

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # 【改这里 1】你的域名。
    server_name vibemobile.example.com;

    server_tokens off;

    # 【按实际路径调整】证书文件。
    ssl_certificate     /etc/nginx/certs/vibemobile.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/vibemobile.privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:vibemobile:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # 文件保存与图片上传：应用侧上限 8 MiB，这里留出 JSON 转义余量。
    client_max_body_size 20m;

    access_log /var/log/nginx/vibemobile.access.log;
    error_log  /var/log/nginx/vibemobile.error.log;

    location / {
        # 【改这里 2】Hub 的地址和端口。Hub 与 nginx 同机时保持回环。
        proxy_pass http://127.0.0.1:3010;

        proxy_http_version 1.1;

        # 覆盖而不是追加 —— 见文件顶部第 1 条。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（聊天 / 终端 / runner 隧道）。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 长连接与流式响应不要被 nginx 攒着。
        proxy_buffering off;
    }
}
